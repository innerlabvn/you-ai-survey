<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="t d"><title id="t">Hành trình khám phá Innerlab</title><desc id="d">Không gian thiên hà tím xanh, người trẻ đeo tai nghe dưới ánh trăng, chiếc cổng ánh sáng mở ra chân trời mới.</desc><defs>
<linearGradient id="sky" x2="0" y2="1"><stop stop-color="#13143b"/><stop offset=".5" stop-color="#333072"/><stop offset="1" stop-color="#272459"/></linearGradient>
<radialGradient id="moon"><stop stop-color="#e0e5ff"/><stop offset=".75" stop-color="#b7bafa"/><stop offset="1" stop-color="#aaa8f2" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop stop-color="#c5adff" stop-opacity=".8"/><stop offset="1" stop-color="#bca0fa" stop-opacity="0"/></radialGradient>
<linearGradient id="hair" x2="1" y2="1"><stop stop-color="#171b4a"/><stop offset=".46" stop-color="#453369"/><stop offset=".83" stop-color="#7960a8"/><stop offset="1" stop-color="#24204d"/></linearGradient>
<linearGradient id="skin" x2="1" y2="1"><stop stop-color="#fde1d4"/><stop offset="1" stop-color="#be97af"/></linearGradient>
<linearGradient id="arch" x2="0" y2="1"><stop stop-color="#dac0ff"/><stop offset=".7" stop-color="#a586ff"/><stop offset="1" stop-color="#8df7e4"/></linearGradient>
<linearGradient id="portal" x2="0" y2="1"><stop stop-color="#8f78e7"/><stop offset=".45" stop-color="#d7beff"/><stop offset="1" stop-color="#d1e9f6"/></linearGradient>
<linearGradient id="stairs" x2="0" y2="1"><stop stop-color="#f8dbff"/><stop offset="1" stop-color="#6e72c6"/></linearGradient>
<radialGradient id="spark"><stop stop-color="#fff6e1"/><stop offset="1" stop-color="#fff6e1" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="16"/></filter><filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
