<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="innerlabTitle">
<title id="innerlabTitle">Innerlab — hành trình khám phá bản thân</title>
<defs>
  <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#30217b"/><stop offset="1" stop-color="#201052"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b49cf7"/><stop offset=".64" stop-color="#9578e4"/><stop offset="1" stop-color="#8567d5"/>
  </linearGradient>
  <linearGradient id="inside" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4b349f"/><stop offset="1" stop-color="#372079"/>
  </linearGradient>
  <linearGradient id="pathway" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cdf9df"/><stop offset=".55" stop-color="#b8f8dc"/><stop offset="1" stop-color="#84eaca"/>
  </linearGradient>
